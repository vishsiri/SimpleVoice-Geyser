client:

  # default: 30
  # Timeout in seconds
  # WARNING: Developer has disabled timeout enforcement for current dev builds.
  vctimeout: 30

  # default: 2
  # Idle websocket timeout in minutes
  idletimeout: 2

  # default: false
  # Only allow bedrock players to join the chat
  requireBedrock: false

  # default: true
  # Allows bedrock clients to open the SVG menu via emotes.
  # WARNING: Make sure off-hand-emote is disabled in Geyser to avoid conflicts.
  useEmoteForSVG: true

  # default: true
  # Allows players using web-chat to chat in-game
  web-chat-enabled: true

  join-message:

    #default: true
    # Enables join messages for web clients.
    enabled: true

    # Default: provided below
    # The text svg sends when a player joins
    text:
      - "This server uses MineDream Voice Chat."
      - "Open https://voicechat.minedream.city and sign in with your MineDream account."

server:

  group:

    # Settings for the default group for SVG web players.
    default:

      # default: true
      # Decides whether the SVG group is created for players who use the website.
      enabled: true

      # default: 1a2b
      # Controls the default group's password.
      password: 1a2b

      # default: false
      # Force assigning the default SVG group even when a user already has a group.
      force-on-web-join: false

  # default: 8080
  # Port server will run on.
  port: 8080

  # default: 127.0.0.1
  # Keep Jetty private. Use a private interface only when the reverse proxy is on another host.
  bind-address: 127.0.0.1

  # default: /
  # Context path containing the /ws endpoint.
  context-path: /

  # MineDream Webshop SSO. The plugin refuses to start without a secure API URL and key.
  sso:
    api-base-url: ""
    api-key: ""
    allowed-origin: "https://voicechat.minedream.city"
    request-timeout-ms: 5000

  audio:

    # default: auto
    # Audio transport preference: auto | legacy | svg-v2
    transport-mode: auto

    # default: true
    # During migration, fallback to legacy transport for incompatible clients.
    allow-legacy-fallback: true

# default: false
# Debug logs
# Do NOT use this in production. This will very quickly fill up your server logs.
debug: false

# default: true
# Check for plugin updates on startup.
updatechecker:
  enable: true

# default: 0.1.1-dev-migration1
# Internal config schema marker used for migration tracking.
config-version: 0.1.1-dev-migration1
